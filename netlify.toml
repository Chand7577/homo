# Netlify Configuration for HOMEO A.I

[build]
  publish = "dist"
  command = "npm run build"

# Cache Control Headers
[[headers]]
  # Cache static assets (images, fonts) for 1 year
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Don't cache HTML files - always fetch fresh
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  # Don't cache the main index
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  # Cache JavaScript/CSS with validation (check for updates)
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
